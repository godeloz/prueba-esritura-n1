<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PLEE · Prueba de escritura, nivel 1 · Universidad EAFIT</title>
<meta name="description" content="App de práctica y simulacro para la prueba de escritura de nivel 1 de la Política de Lectura y Escritura en Español de la Universidad EAFIT.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>/* ============ tokens ============ */
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F4;
  --ink:#16233F; --ink-2:#55627B; --ink-3:#8A93A6;
  --line:#DFE3EA; --line-2:#C9D0DB;
  --tesis:#1D4E89; --tesis-wash:#E7EEF7; --tesis-line:#AFC6E0;
  --contra:#8B4670; --contra-wash:#F6EAF1; --contra-line:#DDB9CD;
  --ok:#1D7A4F; --ok-wash:#E6F3EC;
  --no:#BE3A30; --no-wash:#FBEAE8;
  --warn:#9A6408; --warn-wash:#FBF1DF;
  --r:14px; --r-s:9px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sombra:0 1px 2px rgba(22,35,63,.05),0 6px 20px rgba(22,35,63,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F1420; --surface:#171E2C; --surface-2:#1E2636;
    --ink:#E8ECF3; --ink-2:#AAB4C6; --ink-3:#78839A;
    --line:#2A3344; --line-2:#3A455A;
    --tesis:#6FA3DC; --tesis-wash:#1A2740; --tesis-line:#33507A;
    --contra:#D48FB6; --contra-wash:#2E1E28; --contra-line:#573A4A;
    --ok:#5FC08D; --ok-wash:#12291F; --no:#F08379; --no-wash:#2E1917;
    --warn:#E0B15F; --warn-wash:#2B2313;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-bottom:64px;
}
h1,h2,h3,h4{line-height:1.22;margin:0 0 .5em}
h1{font-family:var(--serif);font-size:1.75rem;font-weight:600;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:1.34rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
h4{font-size:.94rem;font-weight:600;color:var(--ink-2)}
p{margin:0 0 .85em}
a{color:var(--tesis)}
:focus-visible{outline:2px solid var(--tesis);outline-offset:2px;border-radius:4px}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ============ cabecera ============ */
header{
  position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:10px;padding:9px 0 7px}
.hd .marca{font-family:var(--serif);font-weight:600;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
.hd .marca small{display:block;font-family:var(--sans);font-size:.66rem;font-weight:500;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.hd .sep{flex:1}

/* la barra ponderada: el elemento firma */
.barra{display:flex;gap:2px;height:9px;width:100%;margin:0 0 8px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.barra .seg{position:relative;background:var(--line);transition:background .2s}
.barra .seg i{position:absolute;inset:auto 0 0 0;background:var(--tesis);display:block}
.barra .seg.act{background:var(--tesis-line)}
.barra.grande{height:56px;border-radius:var(--r-s);gap:3px}
.barra.grande .seg{display:flex;align-items:flex-end;justify-content:center;background:var(--surface-2)}
.barra.grande .seg b{position:relative;z-index:2;font-family:var(--mono);font-size:.62rem;padding:2px 0;color:var(--ink-2)}
.leyenda{display:flex;gap:2px;margin:-4px 0 14px}
.leyenda span{font-family:var(--mono);font-size:.6rem;color:var(--ink-3);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* dos zonas separadas por un hueco: análisis y escritura */
.barra .hueco{flex:0 0 14px;background:none}
.zonas{display:flex;gap:18px;margin:0 0 14px}
@media (max-width:640px){.zonas{flex-direction:column;gap:14px}}
.zona{min-width:0}
.zona .zt{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
.zona .zt span{font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zona .zt b{font-family:var(--mono);font-size:.72rem;color:var(--tesis)}
.zona:last-child .zt b{color:var(--contra)}
.hueco-zona{flex:0 0 1px;background:var(--line)}
@media (max-width:640px){.hueco-zona{display:none}}

/* fichas de familia en la portada */
.fam{border:1px solid var(--line);border-left:3px solid var(--tesis);border-radius:0 var(--r-s) var(--r-s) 0;padding:12px 14px;margin:0 0 10px;background:var(--surface)}
.fam-escritura{border-left-color:var(--contra)}
.fam .ft{display:flex;align-items:baseline;gap:10px}
.fam .ft strong{flex:1;font-family:var(--serif);font-size:1.05rem}
.fam-escritura .peso{color:var(--contra);background:var(--contra-wash);border-color:var(--contra-line)}

/* ============ botones ============ */
button{font:inherit;color:inherit}
.b{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:8px 13px;cursor:pointer;font-size:.88rem;font-weight:500;
  transition:background .12s,border-color .12s;
}
.b:hover{background:var(--surface-2)}
.b.p{background:var(--tesis);border-color:var(--tesis);color:#fff}
.b.p:hover{filter:brightness(1.08)}
.b.peq{padding:5px 9px;font-size:.78rem}
.b.riesgo{color:var(--no);border-color:var(--no)}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.act{background:var(--tesis-wash);border-color:var(--tesis-line);color:var(--tesis)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .b{white-space:nowrap;flex:0 0 auto}

/* ============ tarjetas ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--sombra)}
.card.plano{box-shadow:none}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.peso{font-family:var(--mono);font-size:.72rem;color:var(--tesis);background:var(--tesis-wash);border:1px solid var(--tesis-line);border-radius:99px;padding:1px 8px}
.nota{background:var(--surface-2);border-left:3px solid var(--line-2);padding:10px 12px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:.88rem;color:var(--ink-2);margin:0 0 12px}
.nota.aviso{background:var(--warn-wash);border-left-color:var(--warn);color:var(--ink)}
.nota.clave{background:var(--tesis-wash);border-left-color:var(--tesis)}
.destacado{background:var(--tesis-wash);border:1px solid var(--tesis-line);border-radius:var(--r);padding:14px 16px;margin:0 0 16px}
.destacado h3{color:var(--tesis)}

table{width:100%;border-collapse:collapse;font-size:.86rem;margin:0 0 12px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}

ul,ol{margin:0 0 .9em;padding-left:1.15em}
li{margin:0 0 .35em}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.dos{grid-template-columns:1fr}}

/* ============ visor / comparador ============ */
.visor{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column}
.visor .vh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 0}
.visor .vbody{flex:1;overflow-y:auto;padding:14px 0 40px}
.fuente-txt{font-family:var(--serif);font-size:1.03rem;line-height:1.62}
.fuente-txt .par{display:flex;gap:10px;margin:0 0 14px}
.fuente-txt .par .n{font-family:var(--mono);font-size:.7rem;color:var(--tesis);flex:0 0 26px;padding-top:5px;user-select:none}
.res-txt{font-family:var(--serif);font-size:1rem;line-height:1.6;white-space:pre-wrap}
.comparar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:820px){.comparar{grid-template-columns:1fr}}
.comparar .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.comparar .col h4{margin-bottom:8px;color:var(--tesis)}
.comparar .col .res-txt{font-size:.9rem}

/* ============ ejercicios ============ */
.ej{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px;box-shadow:var(--sombra)}
.ej .cab{display:flex;align-items:flex-start;gap:10px;margin:0 0 4px}
.ej .cab .num{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);padding-top:3px}
.ej .cab h3{flex:1;margin:0}
.motor{font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap}
.ctx{font-family:var(--serif);background:var(--surface-2);border-radius:var(--r-s);padding:11px 13px;margin:0 0 12px;font-size:.96rem}
.pregunta{font-weight:600;margin:14px 0 9px}

.ops{display:flex;flex-direction:column;gap:7px}
.op{display:flex;gap:9px;text-align:left;align-items:flex-start;width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;font-size:.92rem;line-height:1.45}
.op:hover:not(:disabled){border-color:var(--tesis-line);background:var(--tesis-wash)}
.op .l{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);flex:0 0 auto;padding-top:2px}
.op:disabled{cursor:default}
.op.sel{border-color:var(--tesis);background:var(--tesis-wash)}
.op.bien{border-color:var(--ok);background:var(--ok-wash)}
.op.mal{border-color:var(--no);background:var(--no-wash)}

.fb{border-radius:var(--r-s);padding:10px 12px;margin:9px 0 0;font-size:.88rem;line-height:1.5}
.fb.bien{background:var(--ok-wash);border:1px solid var(--ok)}
.fb.mal{background:var(--no-wash);border:1px solid var(--no)}
.fb.neutro{background:var(--surface-2);border:1px solid var(--line)}
.fb b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 3px}

.frag{border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;margin:0 0 10px;background:var(--surface)}
.frag .t{font-family:var(--serif);font-size:.97rem;margin:0 0 9px}
.etqs{display:flex;flex-wrap:wrap;gap:6px}
.etq{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.8rem;cursor:pointer}
.etq:hover:not(:disabled){border-color:var(--tesis-line)}
.etq.sel{background:var(--tesis-wash);border-color:var(--tesis);color:var(--tesis)}
.etq.bien{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.etq.mal{background:var(--no-wash);border-color:var(--no);color:var(--no)}
.etq:disabled{cursor:default}

.cotejo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
@media (max-width:640px){.cotejo{grid-template-columns:1fr}}
.cotejo .lado{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 11px;font-family:var(--serif);font-size:.93rem}
.cotejo .lado.f{background:var(--surface-2)}
.cotejo .lado.r{background:var(--contra-wash);border-color:var(--contra-line)}
.cotejo .lado .eyebrow{color:var(--ink-3)}

.pieza{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-s);padding:9px 10px;margin:0 0 7px;background:var(--surface)}
.pieza .txt{flex:1;font-size:.9rem}
.pieza .mv{display:flex;flex-direction:column;gap:3px}
.pieza .mv button{border:1px solid var(--line-2);background:var(--surface);border-radius:5px;width:26px;height:20px;cursor:pointer;font-size:.66rem;line-height:1}
.pieza.bien{border-color:var(--ok);background:var(--ok-wash)}
.pieza.mal{border-color:var(--no);background:var(--no-wash)}

.marcable{background:none;border:1px solid transparent;border-radius:5px;padding:1px 3px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.marcable:hover:not(:disabled){background:var(--surface-2)}
.marcable.on{background:var(--tesis-wash);border-color:var(--tesis)}
.marcable.bien{background:var(--ok-wash);border-color:var(--ok)}
.marcable.mal{background:var(--no-wash);border-color:var(--no)}
.marcable.perdida{border-color:var(--warn);border-style:dashed;background:var(--warn-wash)}
.texto-marcar{font-family:var(--serif);font-size:1rem;line-height:2.05}
.texto-marcar.oraciones{line-height:1.7}
.texto-marcar.oraciones .marcable{display:block;margin:0 0 6px;padding:6px 8px;border-color:var(--line)}

.acciones{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0}
.marcador{font-family:var(--mono);font-size:.74rem;color:var(--ink-2)}

/* ============ simulacro ============ */
.sim-cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:1000px){
  .sim-cols.conVisor{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sim-cols .panel-visor{max-height:78vh;overflow-y:auto}
}
textarea.compositor{
  width:100%;min-height:340px;resize:vertical;
  font-family:var(--serif);font-size:1.05rem;line-height:1.62;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;
}
.contadores{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:.76rem;color:var(--ink-2);margin:8px 0}
.contadores .bien{color:var(--ok)}
.contadores .mal{color:var(--no)}
.mapa-par{display:flex;flex-direction:column;gap:6px;margin:10px 0 0}
.mapa-par .fila{display:flex;gap:8px;align-items:center;font-size:.82rem}
.mapa-par .fila .p{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);flex:0 0 30px}
.mapa-par .fila .frag{flex:1;margin:0;padding:5px 8px;font-family:var(--serif);font-size:.84rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapa-par select,select.sel{font:inherit;font-size:.8rem;padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)}
.senal{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.senal .ic{font-family:var(--mono);font-size:.8rem;flex:0 0 20px;text-align:center}
.senal.ok .ic{color:var(--ok)}
.senal.no .ic{color:var(--ink-3)}
.senal .nb{font-size:.88rem;font-weight:500}
.senal .de{font-size:.8rem;color:var(--ink-2)}
.senal.esclave{background:var(--tesis-wash);border-radius:var(--r-s);padding:8px 10px;border-bottom:none;margin:4px 0}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:.88rem;cursor:pointer}
.chk input{margin-top:4px;flex:0 0 auto}

/* ============ superposiciones y diálogos ============ */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(10,16,28,.5);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.ovl{align-items:center;padding:24px}}
.ovl .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:640px;max-height:86vh;overflow-y:auto;padding:18px 18px 26px}
@media (min-width:700px){.ovl .panel{border-radius:var(--r)}}
.ovl .panel h3{margin-bottom:10px}
.ovl .lista button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;font-size:.9rem}
.ovl .lista button:hover{background:var(--surface-2)}
.ovl .lista .g{font-family:var(--mono);font-size:.66rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:12px 4px 4px}

/* ============ diagnóstico ============ */
.res-num{font-family:var(--mono);font-size:2.4rem;font-weight:600;line-height:1}
.res-num small{font-size:.9rem;color:var(--ink-2);font-weight:400}
.prio{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.prio .pts{font-family:var(--mono);font-size:.95rem;color:var(--no);flex:0 0 62px}
.prio .nb{flex:1;font-size:.9rem}
.prio .nb small{display:block;color:var(--ink-2);font-size:.79rem}

/* ============ varios ============ */
.pie{color:var(--ink-3);font-size:.78rem;text-align:center;padding:26px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  header,nav.tabs,.acciones,.b,.visor{display:none!important}
  body{background:#fff;padding:0}
  .card,.ej{break-inside:avoid;box-shadow:none;border-color:#ccc}
}
</style>

<body>
<div id="app"></div>
<script>/* ===== data-modelo.js ===== */
/* data-modelo.js — modelo de entrenamiento de la app.
 *
 * La app NO califica con la rúbrica institucional. Entrena ocho componentes y
 * mide el grado de preparación en cada uno. El mapeo a la rúbrica vigente vive
 * en RUBRICA_INSTITUCIONAL y es solo una capa de correspondencia: cuando CELEE
 * publique otra rúbrica, se reemplaza ese objeto y nada más.
 *
 *   ejercicio → componente → criterio institucional → descriptor
 */

/* ------------------------------------------------------------------ */
/* Familias                                                            */
/* ------------------------------------------------------------------ */
const FAMILIAS = [
  {
    id: 'analisis',
    nombre: 'Lo que analizas del resumen',
    corto: 'Análisis',
    peso: 40,
    que: 'Las cuatro características que la prueba pide evaluar en el resumen producido por IA. Son propiedades del resumen, no de tu texto.',
    color: 'tesis'
  },
  {
    id: 'escritura',
    nombre: 'Cómo escribes tú',
    corto: 'Escritura',
    peso: 60,
    que: 'Las cualidades de tu propio texto crítico. La rúbrica vigente dedica a esto nueve de sus doce criterios: se evalúa mucho más cómo escribes que cuánto sabes del resumen.',
    color: 'contra'
  }
];

/* ------------------------------------------------------------------ */
/* Componentes de entrenamiento                                        */
/* ------------------------------------------------------------------ */
const COMPONENTES = [
  {
    id: 'k1', n: 1, familia: 'analisis', peso: 10,
    nombre: 'Idea principal', corto: 'Idea',
    definicion: 'El resumen presenta la afirmación central que el texto fuente busca transmitir.',
    gesto: 'Mostrar que la idea principal declarada por el resumen es la misma que sostiene el texto fuente.'
  },
  {
    id: 'k2', n: 2, familia: 'analisis', peso: 10,
    nombre: 'Estructura', corto: 'Estructura',
    definicion: 'El resumen describe cómo está organizado el texto fuente.',
    gesto: 'Mostrar que el resumen describe la organización del texto, no que la reproduce.'
  },
  {
    id: 'k3', n: 3, familia: 'analisis', peso: 10,
    nombre: 'Fidelidad', corto: 'Fidelidad',
    definicion: 'El resumen presenta de manera fiel la información del texto fuente.',
    gesto: 'Probar, con las dos fuentes a la vista, que lo que el resumen afirma está efectivamente en el texto.'
  },
  {
    id: 'k4', n: 4, familia: 'analisis', peso: 10,
    nombre: 'Estrategias discursivas', corto: 'Estrategias',
    definicion: 'El resumen describe recursos que el autor emplea para persuadir, informar o involucrar al lector.',
    gesto: 'Mostrar que la estrategia que el resumen nombra es la que el texto fuente emplea, señalando dónde.'
  },
  {
    id: 'k5', n: 5, familia: 'escritura', peso: 15,
    nombre: 'Postura y adecuación', corto: 'Postura',
    definicion: 'Tu texto formula una postura explícita sobre la calidad del resumen desde el párrafo introductorio, mantiene un registro formal y se ajusta a la extensión pedida.',
    gesto: 'Que el lector sepa qué opinas del resumen antes de terminar el primer párrafo.'
  },
  {

    "Marie-Angélique Memmie Le Blanc, la “niña salvaje” de Songy, fue, durante algunos años tras su captura, una pequeña celebridad. La escritora Marie-Catherine Homassel Hecquet –que la conoció– escribió su historia en 1755, y en los últimos años su figura ha vuelto a concitar la atención pública gracias a una biografía de Anne Cayre y a la novela gráfica Salvaje de Aurélie Bévière, Jean-David Morvan, Gaëlle Hersent y Serge Aroles. Pero su caso está lejos de ser único en su tipo, como quizás recuerden quienes hayan visto El pequeño salvaje, filme de François Truffaut inspirado en la historia de Víctor de Aveyron, posiblemente una de las más conocidas y documentadas entre las de niños ferales: Víctor fue capturado en enero de 1800 y sometido a estudio y “tratamiento” por parte del médico Jean Itard, quien intentó demostrar que poseía un “sentido moral natural” del tipo postulado por Jean-Jacques Rousseau; los castigos que le aplicó en nombre de su instrucción no arrojaron resultados positivos y el médico acabó deshaciéndose de él.",
    "El así llamado Siglo de las Luces no fue el único que se interesó por los “niños salvajes”; su existencia ya había sido consignada durante la guerra de los Treinta Años, pero los testimonios se multiplicaron durante la ocupación británica de la India, cuando abandonaron el territorio de las fábulas y los relatos orales para constituirse en motivo de curiosidad y objeto de estudio en no pequeña medida gracias a Mowgli, el niño feral de El libro de la selva de Rudyard Kipling. En su ensayo Los hermanos de Kaspar Hauser. A la búsqueda del hombre salvaje (Deuticke, 2003), el periodista alemán P. J. Blumenthal reúne y analiza unas cien historias de niños y niñas criados principalmente por lobos, pero también por osos, leopardos, leones, tigres, babuinos, cerdos y gacelas entre el 539 después de Cristo y el año 2002. Niños como Rubén Marroquín alias Tarzancito, capturado en las proximidades de Sonsonate en El Salvador en 1933; Alex, quien en 2001 escapó de un asilo en Talcahuano, Chile, a los once años de edad para vivir con los perros y fue recluido en un psiquiátrico donde se perdió su rastro; o Marcos Rodríguez Pantoja, a quien su padre vendió en 1953 a unos pastores de Sierra Morena que lo obligaron a vivir aislado cuidando un rebaño de cabras hasta 1965: sus historias no nos hablan de cómo sería el ser humano “en su estado salvaje y natural” –como creyeron los Ilustrados del siglo XVIII– sino de que los límites entre personas y animales son porosos. La Historia no es una progresión ininterrumpida hacia el triunfo del espíritu de la Razón sino una sucesión de avances y retrocesos en cuyo marco cada formulación de una idea de lo humano es también la de lo que no lo es, la de una enorme nada supuestamente vacante, carente de inteligencia y agencia propias, susceptible de ser conquistada, explotada, comercializada y destruida si es necesario.",
    "Blumenthal sostiene que es posible que la mayor parte de los niños ferales fuesen autistas, esquizofrénicos o víctimas de malos tratos tan brutales que no habrían tenido otra alternativa que huir hacia lo salvaje; sobre esto, sin embargo, solo es posible hacer conjeturas, ya que muy pocos consiguieron aprender a hablar tras ser capturados. El “hombre primitivo” es un ser sin historia, observó el escritor francés Lucien Malson en su libro sobre los niños ferales. No solo por esta razón el relato de Marie-Catherine Homassel Hecquet sobre la “niña salvaje” es tan especial: en palabras de los responsables de su edición en español (Pepitas de Calabaza, 2021), es “el único caso documentado de niño salvaje que consigue (re)aprender a hablar y llevar una vida integrada en la sociedad de acogida”.",
    "La isla del doctor Moreau de H. G. Wells –y sus, por lo general, fallidas adaptaciones cinematográficas– propuso a partir de 1896 la inversión del recorrido que realizan los niños ferales: no ir de lo humano a lo animal, sino de lo animal a lo humano. Que siga siendo uno de los relatos de terror más radicalmente disruptivos de la literatura moderna y que continúe perturbándonos el tema de los animales demasiado humanos y de los humanos que actuarían como animales –de diferentes maneras, bajo disfraces distintos– en las páginas de los autores de terror, new weird y literatura fantástica contemporánea pone de manifiesto que, en el fondo, sabemos que los límites entre nosotros y los animales son culturales: como nuestras ideas de orden y de sentido, pueden cambiar y van a hacerlo. Nuestro miedo es el resultado de la imposibilidad de concebir cómo será un mundo “otro” en el que, por ejemplo, la explotación comercial del tipo de personas no humanas que llamamos “animales” sea inconcebible.",
    "La destrucción del mundo físico –cada día más difícil de negar dados los incendios forestales y las temperaturas extremas, la escasez de agua en buena parte del planeta y las cosechas malogradas, la sucesión de olas de calor inéditas y su efecto en las personas más vulnerables, incluidos los trabajadores al aire libre, las mujeres embarazadas y los ancianos– se ha convertido en uno de los asuntos más recurrentes de la práctica artística y la literatura contemporáneas que proponen una revisión de los límites porosos entre los seres humanos y las demás especies, algo que los creadores persiguen de dos maneras principales: exponiendo nuevas maneras de mirar el mundo natural y/o adoptando la perspectiva de alguno de sus integrantes. La espléndida Autobiografía de un pulpo y otros relatos de anticipación de Vinciane Despret que Consonni publicó el año pasado o la más reciente Open throat de Henry Hoke en la que un puma queer –inspirado, por cierto, en P-22, toda una celebridad californiana– contempla Los Ángeles y el estado del mundo desde su refugio bajo el cartel de Hollywood, subvierten de modos diferentes el antropomorfismo y la atribución de rasgos humanos a un animal, pero solo el primero de esos libros –y, más explícitamente, otro de la filósofa belga, Habitar como un pájaro. Modos de hacer y de pensar los territorios (Cactus, 2022)– postula la posibilidad de un segundo “giro copernicano” que esta vez desplace al ser humano como la medida de todas las cosas y a su concepción utilitaria del mundo físico como la dominante en nuestra relación con la naturaleza. Al igual que Pollinator Pathmaker, la instalación de la artista británica Alexandra Daisy Ginsberg inaugurada frente al Museo de Ciencias Naturales de Berlín en junio de este año cuya propuesta consiste en “permitir” que sean los insectos polinizadores los que den forma a un jardín, no los seres humanos y nuestras ideas de orden y armonía, o como Web(s) of life, la exhibición del artista argentino Tomás Saraceno, quien en 2021 exhibió en la Serpentine Gallery de Londres una habitación cubierta de telarañas como si estas fueran una obra de arte, los libros de Despret –y otros, por ejemplo Cuando los animales sueñan. El mundo oculto de la conciencia animal de David M. Peña-Guzmán (Errata Naturae, 2023), Planta sapiens. Descubre la inteligencia secreta de las plantas de Paco Calvo y Natalie Lawrence (Seix Barral, 2023) o El mundo sin nosotros de Alan Weisman (Debate, 2022)–, filmes como My octopus teacher de Pippa Ehrlich y James Reed (2020), Il buco de Michelangelo Frammartino (2021) o EO de Jerzy Skolimowski (2022) apuestan por “deshumanizar” nuestra mirada; son producto del hecho de que –sean conscientes de ello por completo o no– muchas personas parecen compartir en este momento la percepción de que atender a otras formas de vida y procurar ver el mundo con sus ojos puede ofrecer respuestas a la pregunta de cómo continuar, tras hacerse evidente que el proyecto de un crecimiento potencialmente interminable en un mundo físico que no lo es está convirtiendo nuestra vida en un infierno. Escribir acerca de estas cosas es lo único que nos interesa, a algunos escritores, en este momento. Como escribió Jonathan Crary, “hemos cruzado un umbral de irreparabilidad y toxicidad. Cada vez más personas lo saben o lo intuyen, ya que experimentan en silencio sus consecuencias perjudiciales”.",

 *

 * modelo de asesoría; los otros dos son material didáctico y se ofrecen solo en
 * la práctica, porque comparar versiones sigue siendo la forma más rápida de
 * aprender a ver un defecto.
 *
 * Depende de data-fuentes.js (FUENTES) y data-conjuntos.js (CONJUNTOS). */

FUENTES.verdad = [
  'Vivimos en un tiempo en el que todo parece cambiar a una velocidad vertiginosa. El conocimiento se transforma cada día, las certezas se erosionan, las verdades se cuestionan, y el éxito —esa palabra que tanto escuchamos— parece cada vez más frágil, más volátil, más externo. En medio de ese ruido constante, ¿cómo encontrar un camino que sea verdaderamente nuestro? ¿Cómo tomar decisiones que valgan la pena? ¿Cómo saber si lo que estoy recibiendo es cierto?',
  'Una posible respuesta está en recuperar un compromiso con la verdad. En un mundo donde parece haber datos para defender cualquier postura, donde lo que se viraliza no siempre es lo más cierto, la verdad se ha vuelto un terreno resbaladizo. Pero precisamente por eso, es más urgente que nunca asumir que la verdad no es simplemente lo que más se repite, ni lo que genera más clics o más likes. La verdad se construye con responsabilidad, con apertura y con ética. No se trata de imponer verdades únicas, sino de aprender a buscar con honestidad intelectual lo que se sostiene con argumentos, con evidencia y con humanidad.',
  'Hoy, vivimos rodeados de datos. Se celebran como la gran promesa de objetividad. Sin embargo, un dato por sí solo no es la verdad. Puede ser manipulado, sacado de contexto, presentado de manera interesada. En manos de quienes quieren convencer en lugar de comprender, los datos se convierten en herramientas para construir narrativas cómodas, no necesariamente ciertas. Por eso, conocer no es acumular cifras, sino comprometerse con ellas, comprender sus límites y preguntar siempre: ¿qué me están mostrando?, ¿qué están dejando por fuera?',
  'El desafío no está solo en los datos, sino también en los canales a través de los cuales los recibimos. Las redes sociales y los medios de comunicación han transformado la manera en que accedemos a la información. Lo inmediato se impone sobre lo profundo, lo escandaloso sobre lo cierto. En ese entorno, la verdad pierde terreno frente a la emoción. Lo que nos hace reaccionar rápidamente tiene más valor que lo que nos invita a pensar lentamente. Y cuando la lógica que gobierna nuestras conversaciones es la del algoritmo, la pluralidad se empobrece, el disenso se convierte en amenaza y el pensamiento se vuelve superficial.',
  'Frente a todo esto, encontrar la verdad es una forma de resistencia. Y también, de responsabilidad. Porque buscar la verdad es tener el coraje de hacerse preguntas difíciles, de reconocer lo que no sabemos, de cambiar de opinión cuando aprendemos algo nuevo. Es entender que pensar críticamente no es atacar al otro, sino una forma profunda de respeto. Es aceptar que la verdad no siempre es cómoda, pero que sin ella no hay justicia, ni convivencia, ni comunidad posible.',
  'La educación tiene un rol fundamental en este proceso. Educar no puede reducirse a transmitir contenidos ni preparar para pruebas. Educar hoy, más que nunca, implica formar ciudadanos capaces de discernir, de cuestionar, de construir criterios propios. Implica crear espacios donde se valore la duda y no solo la respuesta rápida; donde equivocarse sea parte del proceso de comprender; donde el pensamiento crítico no sea una habilidad secundaria, sino un pilar esencial.',
  'Pensar críticamente no significa desconfiar de todo, ni asumir que todas las versiones son igualmente válidas. Significa estar dispuestos a contrastar fuentes, a analizar argumentos, a poner a prueba nuestras creencias sin aferrarnos a ellas como dogmas. Significa entender que defender lo que creemos justo exige tanto firmeza como humildad.',
  'Y también significa ir más allá de la superficie. Porque la verdad rara vez se encuentra en los extremos, en los eslóganes, en los simplismos que nos ofrecen explicaciones fáciles para problemas complejos. La verdad suele estar en el matiz, en el contexto, en la escucha. En un mundo que premia lo instantáneo y lo superficial, detenerse a pensar es un acto valiente. Pero es precisamente ese tipo de valentía el que necesitamos para construir una sociedad más justa.',
  'No se trata de volvernos expertos en todo, sino de desarrollar una actitud frente al conocimiento y frente a la información. Una actitud que combine escepticismo sano con apertura, y curiosidad con rigor. Una actitud que nos permita no «comer entero», sino preguntarnos: ¿de dónde viene esto?, ¿qué evidencia lo respalda?, ¿quién gana con que yo crea esto?',
  'Tenemos herramientas para hacerlo. Podemos aprender a verificar fuentes, a comparar perspectivas, a identificar sesgos, a detenernos cuando algo nos indigna o emociona demasiado rápido, porque muchas veces lo que se viraliza ha sido diseñado precisamente para eso: para manipularnos. Podemos y debemos conversar más, especialmente con quienes piensan distinto. Porque en ese intercambio puede nacer una comprensión más rica y, quizás, más cercana a la verdad.',
  'Hoy más que nunca necesitamos una ciudadanía comprometida con la verdad. No una verdad única e inamovible, sino una verdad construida en diálogo, con respeto, con argumentos y con voluntad de comprender. Una verdad que no divida, sino que nos permita encontrarnos desde nuestras diferencias. Una verdad que no se use como arma, sino como puente.',
  'Esa es la tarea. Esa es la responsabilidad. Y también, el privilegio. Porque buscar la verdad es una forma de dignidad. Es una forma de libertad. Es una forma de cuidar lo que somos y lo que podemos llegar a ser.'

const $ = (s, r) => (r || document).querySelector(s);
const LETRAS = 'ABCDEFGH';
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function barajar(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Permutación garantizada distinta del orden natural cuando n > 1. */
function barajarDistinto(n) {
  if (n < 2) return [0];
  let p, intentos = 0;
  do { p = barajar(n); intentos++; } while (intentos < 40 && p.every((v, i) => v === i));
  if (p.every((v, i) => v === i)) { [p[0], p[1]] = [p[1], p[0]]; }
  return p;
}
function palabras(t) { return (t || '').trim() ? t.trim().split(/\s+/).length : 0; }
function parrafosDe(t) { return (t || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean); }
function pct(x) { return Math.round(x * 100); }
function conjuntoPorId(id) { return CONJUNTOS.find((c) => c.id === id); }
function conceptoPorId(id) { return CONCEPTOS.find((c) => c.id === id); }
/* componentePorId, familiaPorId y componentesDe viven en data-modelo.js */
function fmtTiempo(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* --------- estado de un ejercicio --------- */
function nuevoEstado(e) {
  const st = { motor: e.motor, resp: {}, intentos: {}, perm: {}, comprobado: false };
  if (e.motor === 'mc' || e.motor === 'cloze' || e.motor === 'reescritura') {
    e.items.forEach((it) => { st.perm[it.id] = barajarDistinto(it.opciones.length); });
  } else if (e.motor === 'clasificar') {
    st.permEtq = barajarDistinto(e.etiquetas.length);
  } else if (e.motor === 'cotejar') {
    st.permEtq = barajarDistinto(e.etiquetas.length);
  } else if (e.motor === 'ordenar') {
    st.orden = barajarDistinto(e.piezas.length);
  } else if (e.motor === 'marcar') {
    st.marcadas = {};
  }
  return st;
}
function est(e) {
  if (!S.ej[e.id]) S.ej[e.id] = nuevoEstado(e);
  return S.ej[e.id];
}
/* Comprueba contra undefined y contra null: un motor que no usa `resp` deja el
   campo indefinido y `!== null` daría verdadero. */
function tieneRespuestas(e) {
  const st = S.ej[e.id];
  if (!st) return false;
  if (st.comprobado) return true;
  if (st.resp && Object.keys(st.resp).length) return true;
  if (st.marcadas && Object.keys(st.marcadas).some((k) => st.marcadas[k])) return true;
  if (st.orden && st.movido) return true;
  return false;
}
function unidadesDe(e) {
  return e.unidades.map((u) => (typeof u === 'string' ? { t: u, marcar: false } : Object.assign({ marcar: true }, u)));
}

/* ================= puntuación ================= */
function puntuar(e) {
  const st = S.ej[e.id];
  if (!st) return null;
  if (e.motor === 'mc' || e.motor === 'cloze' || e.motor === 'reescritura') {
    const resueltos = e.items.filter((it) => st.resp[it.id] !== undefined);
    if (!resueltos.length) return null;
    const buenos = e.items.filter((it) => st.primera && st.primera[it.id]).length;
    return { hecho: resueltos.length, total: e.items.length, frac: buenos / e.items.length };
  }
  if (e.motor === 'clasificar' || e.motor === 'cotejar') {
    const col = e.motor === 'clasificar' ? e.fragmentos : e.items;
    const resueltos = col.filter((f) => st.resp[f.id] !== undefined);
    if (!resueltos.length) return null;
    const buenos = col.filter((f) => st.primera && st.primera[f.id]).length;
    return { hecho: resueltos.length, total: col.length, frac: buenos / col.length };
  }
  if (e.motor === 'ordenar') {
    if (!st.comprobado) return null;
    const buenos = st.orden.filter((v, i) => v === i).length;
    return { hecho: 1, total: 1, frac: buenos / e.piezas.length };
  }
  if (e.motor === 'marcar') {
    if (!st.comprobado) return null;
    const us = unidadesDe(e);
    const totales = us.filter((u) => u.marcar).length;
    let ac = 0, fp = 0;
    us.forEach((u, i) => {
      if (st.marcadas[i] && u.marcar) ac++;
      if (st.marcadas[i] && !u.marcar) fp++;
    });
    return { hecho: 1, total: 1, frac: Math.max(0, (ac - fp) / totales) };
  }
  return null;
}
function puntuarComponente(cid) {
  const propios = EJ().filter((e) => e.comp === cid);
  const con = propios.map((e) => puntuar(e)).filter(Boolean);
  if (!con.length) return null;
  return { frac: con.reduce((a, p) => a + p.frac, 0) / con.length, ejercicios: con.length, total: propios.length };
}
function ponderado() {
  const filas = COMPONENTES.map((c) => ({ c, p: puntuarComponente(c.id) })).filter((f) => f.p);
  if (!filas.length) return null;
  const pesoTotal = filas.reduce((a, f) => a + f.c.peso, 0);
  const suma = filas.reduce((a, f) => a + f.c.peso * f.p.frac, 0);
  return { frac: suma / pesoTotal, pesoCubierto: pesoTotal, filas };
}

/* ================= heurística del simulacro ================= */
function analizarTexto(texto, conjuntoId, elegido) {
  const t = (texto || '').trim();
  const bajo = t.toLowerCase();
  const lx = SIMULACRO.lexico;
  const c = conjuntoPorId(conjuntoId);
  const nPal = palabras(t);
  const pars = parrafosDe(t);
  const hay = (arr) => arr.some((k) => bajo.includes(k.toLowerCase()));

  const nombraElegido = c && c.modalidad === 'evaluacion'
    ? /resumen/i.test(t)
    : (elegido !== null && elegido !== undefined
      ? new RegExp('agente\\s*' + (elegido + 1), 'i').test(t)
      : /agente\s*[123]/i.test(t));

  const refFuente = hay(lx.referenciaFuente) || (c && bajo.includes(c.autor.split(' ').pop().toLowerCase()));
  const refResumen = hay(lx.referenciaResumen);

  const cubre = Object.entries(lx.caracteristicas).filter(([, ks]) => hay(ks)).map(([k]) => k);

  const primerPar = (pars[0] || '').toLowerCase();
  const hayPostura = lx.marcasPostura.some((k) => primerPar.includes(k.toLowerCase()));

  const s = {
    s1: nPal >= SIMULACRO.extension.min && nPal <= SIMULACRO.extension.max,
    s8: hayPostura,
    s2: pars.length >= 4,
    s3: nombraElegido,
    s4: hay(lx.marcasCita),
    s5: refFuente && refResumen,
    s6: hay(lx.marcasCorrespondencia),
    s7: cubre.length === 4
  };
  return { senales: s, nPal, nPar: pars.length, cubre, banda: bandaExtension(nPal), total: Object.values(s).filter(Boolean).length };
}

/* ================= motores ================= */
function pintarEjercicio(e, n) {
  const st = est(e);
  const cab = `<div class="cab"><span class="num">${String(n).padStart(2, '0')}</span><h3>${esc(e.titulo)}</h3><span class="motor">${e.motor}</span></div>
    <p style="color:var(--ink-2);font-size:.9rem">${esc(e.enunciado)}</p>
    ${e.ayuda ? `<div class="nota">${esc(e.ayuda)}</div>` : ''}`;
  let cuerpo = '';
  if (e.motor === 'mc' || e.motor === 'cloze' || e.motor === 'reescritura') cuerpo = pintarOpciones(e, st);
  else if (e.motor === 'clasificar') cuerpo = pintarClasificar(e, st);
  else if (e.motor === 'cotejar') cuerpo = pintarCotejar(e, st);
  else if (e.motor === 'ordenar') cuerpo = pintarOrdenar(e, st);
  else if (e.motor === 'marcar') cuerpo = pintarMarcar(e, st);
  const p = puntuar(e);
  const pie = `<div class="acciones">
      ${p ? `<span class="marcador">${pct(p.frac)} % · ${p.hecho}/${p.total}</span>` : ''}
      ${tieneRespuestas(e) ? `<button class="b peq" data-a="limpiar-ej" data-e="${e.id}">Limpiar respuestas</button>` : ''}
      ${e.conjunto ? `<button class="b peq" data-a="visor" data-k="${e.conjunto}">Ver el texto</button>` : ''}
    </div>`;
  return `<section class="ej" id="ej-${e.id}">${cab}${cuerpo}${pie}</section>`;
}

function pintarOpciones(e, st) {
  return e.items.map((it) => {
    const perm = st.perm[it.id];
    const elegida = st.resp[it.id];
    const resuelto = elegida !== undefined;
    const ops = perm.map((oi, pos) => {
      const o = it.opciones[oi];
      let cl = '';
      if (resuelto) {
        if (o.ok) cl = ' bien';
        else if (oi === elegida) cl = ' mal';
      }
      return `<button class="op${cl}" data-a="op" data-e="${e.id}" data-i="${it.id}" data-o="${oi}" data-pos="${pos}" ${resuelto ? 'disabled' : ''}>
        <span class="l">${LETRAS[pos]}</span><span>${esc(o.t)}</span></button>`;
    }).join('');
    let fb = '';
    if (resuelto) {
      const posCorrecta = perm.indexOf(it.opciones.findIndex((o) => o.ok));
      const correcta = it.opciones.find((o) => o.ok);
      const elegidaOp = it.opciones[elegida];
      if (elegidaOp.ok) {
        fb = `<div class="fb bien"><b>Correcto · opción ${LETRAS[posCorrecta]}</b>${esc(correcta.fb)}</div>`;
      } else {
        const posElegida = perm.indexOf(elegida);
        fb = `<div class="fb mal"><b>Por qué falla la opción ${LETRAS[posElegida]}</b>${esc(elegidaOp.fb)}</div>
              <div class="fb bien"><b>Por qué acierta la opción ${LETRAS[posCorrecta]}</b>${esc(correcta.fb)}</div>`;
      }
    }
    return `<div>
      ${it.contexto ? `<div class="ctx">${esc(it.contexto)}</div>` : ''}
      ${it.fragmento ? `<div class="ctx">${esc(it.fragmento)}</div>` : ''}
      ${it.diagnostico ? `<div class="nota aviso">${esc(it.diagnostico)}</div>` : ''}
      ${it.frase ? `<div class="ctx">${esc(it.frase).replace('___', '<strong style="color:var(--tesis)">______</strong>')}</div>` : ''}
      ${it.pregunta ? `<p class="pregunta">${esc(it.pregunta)}</p>` : ''}
      <div class="ops">${ops}</div>${fb}</div>`;
  }).join('<hr style="border:none;border-top:1px solid var(--line);margin:16px 0">');
}

function pintarClasificar(e, st) {
  const etqs = st.permEtq.map((i) => e.etiquetas[i]);
  return e.fragmentos.map((f) => {
    const sel = st.resp[f.id];
    const resuelto = sel !== undefined;
    const bot = etqs.map((et) => {
      let cl = '';
      if (resuelto) {
        if (et === f.ok) cl = ' bien';
        else if (et === sel) cl = ' mal';
      }
      return `<button class="etq${cl}" data-a="etq" data-e="${e.id}" data-f="${f.id}" data-v="${esc(et)}" ${resuelto ? 'disabled' : ''}>${esc(et)}</button>`;
    }).join('');
    let fb = '';
    if (resuelto) {
      fb = sel === f.ok
        ? `<div class="fb bien"><b>Correcto · ${esc(f.ok)}</b>${esc(f.fb[f.ok])}</div>`
        : `<div class="fb mal"><b>Por qué no es «${esc(sel)}»</b>${esc(f.fb[sel])}</div>
           <div class="fb bien"><b>Por qué es «${esc(f.ok)}»</b>${esc(f.fb[f.ok])}</div>`;
    }
    return `<div class="frag"><div class="t">${esc(f.t)}</div><div class="etqs">${bot}</div>${fb}</div>`;
  }).join('');
}

function pintarCotejar(e, st) {
  const etqs = st.permEtq.map((i) => e.etiquetas[i]);
  return e.items.map((it) => {
    const sel = st.resp[it.id];
    const resuelto = sel !== undefined;
    const bot = etqs.map((et) => {
      let cl = '';
      if (resuelto) {
        if (et === it.ok) cl = ' bien';
        else if (et === sel) cl = ' mal';
      }
      return `<button class="etq${cl}" data-a="etq" data-e="${e.id}" data-f="${it.id}" data-v="${esc(et)}" ${resuelto ? 'disabled' : ''}>${esc(et)}</button>`;
    }).join('');
    let fb = '';
    if (resuelto) {
      fb = sel === it.ok
        ? `<div class="fb bien"><b>Correcto · ${esc(it.ok)}</b>${esc(it.fb[it.ok])}</div>`
        : `<div class="fb mal"><b>Por qué no es «${esc(sel)}»</b>${esc(it.fb[sel])}</div>
           <div class="fb bien"><b>Por qué es «${esc(it.ok)}»</b>${esc(it.fb[it.ok])}</div>`;
    }
    const c = conjuntoPorId(it.conjunto);
    return `<div class="frag">
      <div class="cotejo">
        <div class="lado f"><p class="eyebrow">Texto fuente${c ? ' · ' + esc(c.titulo) : ''}</p>${esc(it.fuente)}</div>
        <div class="lado r"><p class="eyebrow">Resumen</p>${esc(it.resumen)}</div>
      </div>
      <div class="etqs">${bot}</div>${fb}</div>`;
  }).join('');
}

function pintarOrdenar(e, st) {
  const filas = st.orden.map((oi, pos) => {
    const p = e.piezas[oi];
    let cl = '';
    if (st.comprobado) cl = oi === pos ? ' bien' : ' mal';
    return `<div class="pieza${cl}">
      <div class="mv">
        <button data-a="mover" data-e="${e.id}" data-pos="${pos}" data-d="-1" ${pos === 0 || st.comprobado ? 'disabled' : ''} aria-label="Subir">▲</button>
        <button data-a="mover" data-e="${e.id}" data-pos="${pos}" data-d="1" ${pos === st.orden.length - 1 || st.comprobado ? 'disabled' : ''} aria-label="Bajar">▼</button>
      </div>
      <div class="txt">${esc(p.t)}${st.comprobado ? `<div class="fb ${oi === pos ? 'bien' : 'neutro'}" style="margin-top:7px"><b>Posición ${oi + 1}</b>${esc(p.fb)}</div>` : ''}</div>
    </div>`;
  }).join('');
  const bot = st.comprobado
    ? `<div class="fb neutro">${esc(e.explicacion)}</div>`
    : `<div class="acciones"><button class="b p peq" data-a="comprobar" data-e="${e.id}">Comprobar el orden</button></div>`;
  return filas + bot;
}

function pintarMarcar(e, st) {
  const us = unidadesDe(e);
  const cuerpo = us.map((u, i) => {
    let cl = st.marcadas[i] ? ' on' : '';
    if (st.comprobado) {
      if (st.marcadas[i] && u.marcar) cl = ' bien';
      else if (st.marcadas[i] && !u.marcar) cl = ' mal';
      else if (!st.marcadas[i] && u.marcar) cl = ' perdida';
      else cl = '';
    }
    return `<button class="marcable${cl}" data-a="marcar" data-e="${e.id}" data-u="${i}" ${st.comprobado ? 'disabled' : ''}>${esc(u.t)}</button>`;
  }).join(e.modo === 'palabra' ? ' ' : '');
  let fb = '';
  if (st.comprobado) {
    const detalles = us.map((u, i) => {
      if (st.marcadas[i] && u.marcar) return `<div class="fb bien"><b>Bien marcada</b>${esc(u.fb)}</div>`;
      if (st.marcadas[i] && !u.marcar) return `<div class="fb mal"><b>Falso positivo</b>${esc(u.fb || 'Esta unidad no tenía ningún problema: marcarla resta.')}</div>`;
      if (!st.marcadas[i] && u.marcar) return `<div class="fb mal"><b>Se te pasó</b>${esc(u.fb)}</div>`;
      return '';
    }).join('');
    fb = detalles + `<div class="fb neutro">${esc(e.explicacion)}</div>`;
  }
  const bot = st.comprobado ? '' : `<div class="acciones"><button class="b p peq" data-a="comprobar" data-e="${e.id}">Comprobar</button></div>`;
  return `<div class="texto-marcar ${e.modo === 'oracion' ? 'oraciones' : ''}">${cuerpo}</div>${bot}${fb}`;
}

  const c = conjuntoPorId(S.visor.conjunto);
  const tab = S.visor.pestana;
  const pest = [['fuente', 'Texto fuente']]
    .concat(c.resumenes.map((r, i) => ['r' + i, r.agente]))
    .concat([['comparar', 'Comparar']]);
  let cuerpo = '';
  if (tab === 'fuente') {
    cuerpo = `<div class="fuente-txt">${c.fuente.parrafos.map((p, i) =>
      `<div class="par"><span class="n">¶${i + 1}</span><div>${esc(p)}</div></div>`).join('')}</div>`;
  } else if (tab === 'comparar') {
    cuerpo = `<div class="comparar">${c.resumenes.map((r) =>
      `<div class="col"><h4>${esc(r.agente)}</h4><div class="res-txt">${esc(r.texto)}</div></div>`).join('')}</div>`;
  } else {
    const r = c.resumenes[+tab.slice(1)];

  }
  return `<div class="visor" id="visor">
    <div class="vh"><div class="wrap">
      <div class="hd">
        <div class="marca">${esc(c.titulo)}<small>${esc(c.autor)} · ${esc(c.genero)}</small></div>

    <div class="vbody"><div class="wrap">
      ${c.nota ? `<div class="nota">${esc(c.nota)}</div>` : ''}

      ${cuerpo}
    </div></div>
  </div>`;
}

${S.visor.abierto && S.visor.desdeSim ? '<div class="panel-visor"></div>' : ''}

function pintarPanelSim(a) {
  const ext = SIMULACRO.extension;
  const okExt = a.nPal >= ext.min && a.nPal <= ext.max;
  const pars = parrafosDe(S.sim.texto);
  return `
  <div class="contadores">
    <span class="${okExt ? 'bien' : a.nPal ? 'mal' : ''}">${a.nPal} palabras · rango ${ext.min}–${ext.max}${a.nPal ? ' · ' + esc(a.banda.nivel) : ''}</span>
    <span>${a.nPar} párrafo${a.nPar === 1 ? '' : 's'}</span>
    <span id="crono">${fmtTiempo(tiempoSim())}</span>
    <span>${S.sim.guardado ? 'descargado' : 'sin descargar'}</span>
  </div>
  <div class="acciones">
    <button class="b peq" data-a="descargar-texto" ${a.nPal ? '' : 'disabled'}>Descargar el texto</button>
  </div>
  ${pars.length ? `<div class="mapa-par"><p class="eyebrow" style="margin:10px 0 0">Mapa de párrafos</p>
    ${pars.map((p, i) => `<div class="fila"><span class="p">¶${i + 1}</span>
      <span class="frag">${esc(p.slice(0, 90))}</span>
      <select class="sel" data-a="funcion" data-v="${i}">
        <option value="">función…</option>
        ${SIMULACRO.funcionesParrafo.map((f) => `<option ${S.sim.funciones[i] === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}
      </select></div>`).join('')}

}

function pintarSenales(a) {
  return `<div style="margin-top:14px"><p class="eyebrow">Señales estructurales verificadas</p>
    ${SIMULACRO.senales.map((s) => {
      const v = a.senales[s.id];
      return `<div class="senal ${v ? 'ok' : 'no'}${s.clave ? ' esclave' : ''}">
        <span class="ic">${v ? '✓' : '·'}</span>
        <div><div class="nb">${esc(s.nombre)}${s.clave ? ' — la que más importa' : ''}</div>

}

/* Los conjuntos que el estudiante no ha practicado se ofrecen primero. */
function ordenSimulacro() {
  const rec = (id) => (conjuntoPorId(id).recomendado ? 0 : 1);
  return CONJUNTOS_SIMULACRO.slice().sort((a, b) => rec(a) - rec(b) || respondidosEn(a) - respondidosEn(b));
}

function tiempoSim() {
  return S.sim.acumulado + (S.sim.t0 ? Date.now() - S.sim.t0 : 0);
}

/* ================= diagnóstico ================= */
function pantallaDiagnostico() {
  if (!S.textoActivo) {
    return `<div class="card"><h1>Diagnóstico</h1>
      <p>El diagnóstico se calcula por flujo de práctica. Elige primero un texto.</p>
      <div class="acciones"><button class="b p" data-a="ir" data-p="practica">Elegir un texto</button></div></div>`;
  }
  const kAct = conjuntoPorId(S.textoActivo);
  const pond = ponderado();
  const a = analizarTexto(S.sim.texto, S.sim.conjunto, S.sim.elegido);
  const hechos = EJ().filter((e) => puntuar(e)).length;
  let cuerpo = '';
  if (!pond) {
    cuerpo = `<div class="card"><h2>Todavía no hay práctica que medir</h2>
      <p>Responde ejercicios de cualquier componente y aquí aparecerá tu nivel de entrenamiento, calculado solo sobre lo practicado.</p>
      <button class="b p" data-a="ir" data-p="componente" data-c="k1">Empezar</button></div>`;
  } else {
    const conNivel = pond.filas.map((f) => ({ c: f.c, frac: f.p.frac }));
    const nExperto = conNivel.filter((x) => nivelDe(x.frac).id === 'experto').length;
    const flojos = conNivel.filter((x) => x.frac < 0.70).sort((a, b) => a.frac - b.frac);
    const prioridades = pond.filas
      .map((f) => ({ c: f.c, perdidos: f.c.peso * (1 - f.p.frac), frac: f.p.frac }))
      .filter((x) => x.perdidos > 0.01).sort((x, y) => y.perdidos - x.perdidos);
    cuerpo = `
    <div class="card">
      <p class="eyebrow">Nivel de entrenamiento</p>
      <div class="res-num">${nExperto} de ${COMPONENTES.length}<small> componentes en nivel Experto · ${pct(pond.frac)} % ponderado sobre el ${pond.pesoCubierto} % practicado · ${hechos} de ${EJ().length} ejercicios</small></div>
      ${flojos.length
        ? `<p style="margin-top:10px">Lo que conviene fortalecer: <strong>${flojos.map((x) => esc(x.c.nombre) + ' (' + esc(nivelDe(x.frac).nombre.toLowerCase()) + ')').join(', ')}</strong>. Un promedio alto puede ocultar un componente flojo, y en la prueba cada criterio se evalúa por separado.</p>`
        : '<p style="margin-top:10px;color:var(--ok)">Ningún componente por debajo de Avanzado en lo practicado. Conviene mantenerlo con repasos breves y pasar al simulacro.</p>'}
      ${barraGrande()}
      <div class="nota aviso">${esc(AVISO_NIVELES)}</div>
    </div>

    <div class="card">
      <p class="eyebrow">Componente por componente</p>
      <h2>Dónde estás y qué significa</h2>
      ${FAMILIAS.map((f) => `
        <h4 style="margin-top:14px">${esc(f.nombre)} <span class="peso">${f.peso} %</span></h4>
        ${componentesDe(f.id).map((c) => {
          const p = puntuarComponente(c.id);
          if (!p) return `<div class="prio"><span class="pts" style="color:var(--ink-3);font-size:.8rem">sin practicar</span>
            <span class="nb">${esc(c.nombre)} <small>${esc(c.definicion)}</small></span>
            <button class="b peq" data-a="ir" data-p="componente" data-c="${c.id}">Empezar</button></div>`;
          const niv = nivelDe(p.frac);
          return `<div class="prio"><span class="pts" style="color:var(--${niv.color});font-size:.85rem">${esc(niv.nombre)}</span>
            <span class="nb">${esc(c.nombre)} <small>${pct(p.frac)} % · ${esc(niv.que)}</small></span>
            <button class="b peq" data-a="ir" data-p="componente" data-c="${c.id}">Entrenar</button></div>`;
        }).join('')}`).join('')}
    </div>
    <div class="card">
      <p class="eyebrow">Prioridades</p>
      <h2>Por dónde empezar</h2>
      <p style="font-size:.87rem;color:var(--ink-2)">El orden es <span style="font-family:var(--mono)">peso × brecha</span>, no el porcentaje. Un 40 % en idea principal, que pesa 10, deja menos margen que un 70 % en cohesión, que pesa 15. Por eso este orden no coincide con el de tus peores porcentajes.</p>
      ${prioridades.length ? prioridades.map((x) => `<div class="prio">
        <span class="pts">−${x.perdidos.toFixed(1)}</span>
        <span class="nb">${esc(x.c.nombre)} <small>${esc(nivelDe(x.frac).nombre)} · ${pct(x.frac)} % sobre un peso de ${x.c.peso} %. ${esc(conceptoPorId(x.c.id).distincion.titulo)}.</small></span>
        <button class="b peq" data-a="ir" data-p="componente" data-c="${x.c.id}">Entrenar</button></div>`).join('')
        : '<p>No hay puntos perdidos en lo practicado.</p>'}
    </div>
    <div class="card">
      <p class="eyebrow">Qué hacer en cada uno</p>
      <table><thead><tr><th>Componente</th><th style="width:64px">Tuyo</th><th>Qué hacer</th></tr></thead><tbody>
      ${pond.filas.map((f) => `<tr><td>${esc(f.c.corto)}</td><td><span class="peso">${pct(f.p.frac)} %</span></td>
        <td style="font-size:.84rem">${esc(f.p.frac >= 0.8 ? conceptoPorId(f.c.id).consejos[3] : conceptoPorId(f.c.id).consejos[0])}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  }

  const simBloque = S.sim.texto.trim() ? `

        <tr><th>Resumen elegido</th><td>${S.sim.elegido !== null ? esc(conjuntoPorId(S.sim.conjunto).resumenes[S.sim.elegido].agente) : 'sin declarar'}</td></tr>
        <tr><th>Extensión</th><td>${a.nPal} palabras en ${a.nPar} párrafos</td></tr>
        <tr><th>Tiempo</th><td>${fmtTiempo(tiempoSim())}</td></tr>
        <tr><th>Autoevaluación</th><td>${Object.values(S.sim.autoev).filter(Boolean).length} de ${SIMULACRO.autoevaluacion.length} casillas</td></tr>

      <button class="b p" data-a="ir" data-p="simulacro">Ir al simulacro</button></div>`;

  return `<div class="card plano" style="background:none;border:none;padding:0">
      <h1>Diagnóstico</h1>
      <p style="color:var(--ink-2)">Flujo de práctica sobre «${esc(kAct.titulo)}», de ${esc(kAct.autor)}. Los cuatro componentes de la familia «cómo escribes tú» son transversales y se conservan al cambiar de texto.</p>
    </div>
    ${cuerpo}${simBloque}
    <div class="acciones" style="margin-bottom:30px">
      <button class="b p" data-a="descargar-informe">Descargar el informe</button>
      <button class="b" data-a="imprimir">Imprimir o guardar en PDF</button>
      <button class="b" data-a="cambiar-texto">Cambiar de texto</button>
      <button class="b riesgo" data-a="reset-practica">Borrar la práctica</button>
    </div>`;
}

function descargar(nombre, contenido, tipo) {
  const b = new Blob([contenido], { type: (tipo || 'text/plain') + ';charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}
function marcaTiempo() {
  const d = new Date(), z = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
}

/* ================= acciones ================= */
function comprobarOpcion(e, itemId, oi) {
  const st = est(e);
  if (st.resp[itemId] !== undefined) return;
  const it = e.items.find((x) => x.id === itemId);
  st.resp[itemId] = oi;
  st.primera = st.primera || {};
  st.primera[itemId] = !!it.opciones[oi].ok;
}
function comprobarEtiqueta(e, fid, v) {
  const st = est(e);
  if (st.resp[fid] !== undefined) return;
  const col = e.motor === 'clasificar' ? e.fragmentos : e.items;
  const f = col.find((x) => x.id === fid);
  st.resp[fid] = v;
  st.primera = st.primera || {};
  st.primera[fid] = v === f.ok;
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;

  if (a === 'ovl-fondo') {
    // El fondo y el panel comparten superposición: se distingue por la clase,
    // sin stopPropagation, que bloquearía los botones interiores.
    if (ev.target.classList.contains('ovl')) { S.ovl = null; render(); }
    return;
  }
  if (a === 'ovl-cerrar') { S.ovl = null; render(); return; }
  if (a === 'ovl-ok') {
    const o = S.ovl; S.ovl = null;
    if (b.dataset.modo === 'descargar') o.alDescargar && o.alDescargar();
    o.alConfirmar && o.alConfirmar();
    render();
    return;
  }
  if (a === 'indice') { S.ovl = { tipo: 'indice' }; render(); return; }

  if (a === 'ir') {
    S.ovl = null;
    // «Práctica» resuelve a la elección de texto mientras no haya uno activo.
    S.pantalla = b.dataset.p === 'practica' ? (S.textoActivo ? 'componente' : 'eleccion') : b.dataset.p;
    if (b.dataset.c) S.comp = b.dataset.c;
    if (S.pantalla !== 'simulacro') { S.visor.desdeSim = false; }
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (a === 'visor') { S.visor = { abierto: true, conjunto: b.dataset.k, pestana: 'fuente', desdeSim: false }; S.ovl = null; render(); return; }
  if (a === 'visor-sim') {
    const cs = conjuntoPorId(S.sim.conjunto);
    S.visor = { abierto: true, conjunto: S.sim.conjunto, pestana: cs.modalidad === 'evaluacion' ? 'r0' : 'fuente', desdeSim: true };
    render(); return;
  }
  if (a === 'cerrar-visor') { S.visor.abierto = false; render(); return; }
  if (a === 'pestana') { S.visor.pestana = b.dataset.t; render(); return; }

  if (a === 'elegir-texto') {
    const destino = b.dataset.k;
    if (S.textoActivo && S.textoActivo !== destino && respondidosEn(S.textoActivo) > 0) {
      const anterior = conjuntoPorId(S.textoActivo);
      abrirConfirmacion({
        titulo: 'Cambiar de texto',
        verbo: 'cambiar',
        cuerpo: `Tienes ${respondidosEn(S.textoActivo)} ejercicio${respondidosEn(S.textoActivo) === 1 ? '' : 's'} respondido${respondidosEn(S.textoActivo) === 1 ? '' : 's'} sobre «${anterior.titulo}». Al cambiar a «${conjuntoPorId(destino).titulo}» esas respuestas se borran. Los ejercicios transversales de cohesión y gramática se conservan, y el simulacro no se toca.`,
        conDescarga: false,
        alConfirmar: () => {
          limpiarBloque(S.textoActivo);
          S.textoActivo = destino;
          S.comp = 'k1';
          S.pantalla = 'componente';
        }
      });
      return;
    }
    S.textoActivo = destino;
    S.comp = 'k1';
    S.pantalla = 'componente';
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (a === 'cambiar-texto') {
    S.pantalla = 'eleccion';
    S.ovl = null;
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (a === 'op') {
    const e = EJERCICIOS.find((x) => x.id === b.dataset.e);
    comprobarOpcion(e, b.dataset.i, +b.dataset.o);
    render(); ubicar('ej-' + e.id); return;
  }
  if (a === 'etq') {
    const e = EJERCICIOS.find((x) => x.id === b.dataset.e);
    comprobarEtiqueta(e, b.dataset.f, b.dataset.v);
    render(); ubicar('ej-' + e.id); return;
  }
  if (a === 'mover') {
    const e = EJERCICIOS.find((x) => x.id === b.dataset.e);
    const st = est(e), pos = +b.dataset.pos, d = +b.dataset.d, np = pos + d;
    if (np < 0 || np >= st.orden.length) return;
    [st.orden[pos], st.orden[np]] = [st.orden[np], st.orden[pos]];
    st.movido = true;
    render(); ubicar('ej-' + e.id); return;
  }
  if (a === 'marcar') {
    const e = EJERCICIOS.find((x) => x.id === b.dataset.e);
    const st = est(e), i = b.dataset.u;
    st.marcadas[i] = !st.marcadas[i];
    render(); ubicar('ej-' + e.id); return;
  }
  if (a === 'comprobar') {
    const e = EJERCICIOS.find((x) => x.id === b.dataset.e);
    est(e).comprobado = true;
    render(); ubicar('ej-' + e.id); return;
  }
  if (a === 'limpiar-ej') {
    const e = EJERCICIOS.find((x) => x.id === b.dataset.e);
    S.ej[e.id] = nuevoEstado(e); // vuelve a barajar
    render(); ubicar('ej-' + e.id); return;
  }

  if (a === 'elegir') { S.sim.elegido = +b.dataset.v; render(); return; }
  if (a === 'descargar-texto') {
    descargar(`PLEE_N1_simulacro_${S.sim.conjunto}_${marcaTiempo()}.txt`, S.sim.texto, 'text/plain');
    S.sim.guardado = true; refrescarPanelSim(); return;
  }
  if (a === 'entregar') {
    S.sim.entregado = true;
    if (S.sim.t0) { S.sim.acumulado += Date.now() - S.sim.t0; S.sim.t0 = null; }
    refrescarPanelSim(); return;
  }
  if (a === 'reset-sim') {
    abrirConfirmacion({
      titulo: 'Reiniciar el simulacro', verbo: 'reiniciar',
      cuerpo: `Se borrará el texto (${palabras(S.sim.texto)} palabras), el resumen elegido, el mapa de párrafos, el cronómetro y la autoevaluación. La práctica no se toca.`,
      conDescarga: !!S.sim.texto.trim(),
      alDescargar: () => descargar(`PLEE_N1_simulacro_${S.sim.conjunto}_${marcaTiempo()}.txt`, S.sim.texto, 'text/plain'),
      alConfirmar: () => {
        const k = S.sim.conjunto;
        S.sim = { conjunto: k, elegido: null, texto: '', funciones: {}, autoev: {}, t0: null, acumulado: 0, guardado: true, entregado: false };
      }
    });
    return;
  }
  if (a === 'reset-practica') {
    const n = EJ().filter((e) => tieneRespuestas(e)).length;
    abrirConfirmacion({
      titulo: 'Borrar este flujo de práctica', verbo: 'borrar',
      cuerpo: `Se borrarán las respuestas de ${n} ejercicio${n === 1 ? '' : 's'} de este flujo, incluidos los transversales. Los bloques de los otros textos y el simulacro no se tocan.`,
      conDescarga: false,
      alConfirmar: () => { EJ().forEach((e) => { delete S.ej[e.id]; }); }
    });
    return;
  }
  if (a === 'descargar-informe') {
    descargar(`PLEE_N1_diagnostico_${marcaTiempo()}.html`, generarInforme(), 'text/html');
    S.sim.guardado = true; return;
  }
  if (a === 'imprimir') { window.print(); return; }
});

function ubicar(id) {
  const el = document.getElementById(id);
  if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: 'nearest' }); } catch (x) { /* jsdom */ } }
}

document.addEventListener('input', (ev) => {
  if (ev.target.id === 'compositor') {
    S.sim.texto = ev.target.value;
    S.sim.guardado = false;
    if (!S.sim.t0 && S.sim.texto.trim()) S.sim.t0 = Date.now();
    refrescarPanelSim();
  }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.a) return;
  if (t.dataset.a === 'autoev') { S.sim.autoev[t.dataset.v] = t.checked; return; }
  if (t.dataset.a === 'funcion') { S.sim.funciones[t.dataset.v] = t.value; return; }
  if (t.dataset.a === 'cambiar-conjunto') {
    const candidatos = CONJUNTOS_SIMULACRO.filter((x) => x !== S.sim.conjunto);
    const destino = t.value === '__azar'
      ? candidatos[Math.floor(Math.random() * candidatos.length)]
      : t.value;
    if (!S.sim.texto.trim()) { S.sim.conjunto = destino; S.sim.elegido = null; render(); return; }
    abrirConfirmacion({
      titulo: 'Cambiar de conjunto', verbo: 'empezar',
      cuerpo: `Tienes ${palabras(S.sim.texto)} palabras escritas sobre «${conjuntoPorId(S.sim.conjunto).titulo}». Si cambias de conjunto, ese texto se pierde.`,
      conDescarga: true,
      alDescargar: () => descargar(`PLEE_N1_simulacro_${S.sim.conjunto}_${marcaTiempo()}.txt`, S.sim.texto, 'text/plain'),
      alConfirmar: () => {
        S.sim = { conjunto: destino, elegido: null, texto: '', funciones: {}, autoev: {}, t0: null, acumulado: 0, guardado: true, entregado: false };
      }
    });
    render();
  }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    if (S.ovl) { S.ovl = null; render(); }
    else if (S.visor.abierto) { S.visor.abierto = false; render(); }
  }
});

window.addEventListener('beforeunload', (ev) => {
  if (S.sim.texto.trim() && !S.sim.guardado) { ev.preventDefault(); ev.returnValue = ''; return ''; }
});

/* Cronómetro progresivo. Preparado para convertirse en cuenta regresiva
   cuando se confirme la duración oficial: bastaría restar de una constante. */
setInterval(() => {
  const c = document.getElementById('crono');
  if (c && S.sim.t0) c.textContent = fmtTiempo(tiempoSim());
}, 1000);

render();
</script>
</body>
</html>
